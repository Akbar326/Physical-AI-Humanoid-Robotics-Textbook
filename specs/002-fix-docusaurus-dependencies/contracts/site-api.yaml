# API Contract: Docusaurus Documentation Endpoints

## Overview
This document defines the expected behavior of the Docusaurus documentation site endpoints. Since this is a static site generated by Docusaurus, the "API" consists of the static file serving and client-side routing behavior.

## Endpoints

### GET /
- **Description**: Main landing page of the documentation site
- **Response**: HTML page with site title "Physical AI & Humanoid Robotics"
- **Headers**:
  - Content-Type: text/html
- **Success Response**: 200 OK with complete HTML page

### GET /docs/*
- **Description**: Documentation pages accessible via the docs route
- **Response**: HTML pages for each documentation section
- **Headers**:
  - Content-Type: text/html
- **Success Response**: 200 OK with documentation content

### GET /assets/*
- **Description**: Static assets (JS, CSS, images) for the site
- **Response**: Static files for site functionality
- **Headers**:
  - Content-Type: appropriate for file type
- **Success Response**: 200 OK with asset content

### Client-side Navigation
- **Description**: SPA-style navigation between documentation pages
- **Behavior**: Client-side routing without full page reloads
- **Requirements**: JavaScript must be enabled for navigation

## Error Handling

### 404 Not Found
- **Condition**: Requested page does not exist
- **Response**: Custom 404 page with site navigation

### Build-time Validation
- **Condition**: All internal links must resolve correctly
- **Validation**: Docusaurus build process should fail if broken links exist