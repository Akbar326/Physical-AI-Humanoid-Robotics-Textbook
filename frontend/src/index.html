<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Documentation Chatbot</h1>
            <p>Ask questions about the documentation</p>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                <div class="message-content">
                    <strong>AI Assistant:</strong> Hello! I'm your documentation assistant. Ask me anything about the documentation.
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <div class="input-row">
                <input type="text" id="user-input" placeholder="Type your question here..." />
                <button id="send-button">Send</button>
            </div>
            <div class="agent-toggle">
                <label>
                    <input type="checkbox" id="agent-mode"> Use Advanced Agent
                </label>
            </div>
        </div>

        <div class="typing-indicator" id="typing-indicator" style="display: none;">
            AI Assistant is typing...
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
