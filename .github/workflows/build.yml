name: Build & Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Docusaurus
      run: npm run build

    - name: Markdown Linting
      run: npm run lint --if-present || npx markdownlint "docs/**/*.md" --config .mdlintrc

    - name: Check for build artifacts
      run: |
        if [ -d "build" ]; then
          echo "✅ Build artifacts created successfully"
          du -sh build/
        else
          echo "❌ Build directory not found"
          exit 1
        fi

  linkcheck:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Docusaurus
      run: npm run build

    - name: Check links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'no'
        folder-path: 'docs'
        file-extension: '.md'

  syntax-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Check Python code blocks
      run: |
        python3 -m py_compile \
          $(find docs -name '*.md' -exec grep -l '```python' {} \; | \
            xargs grep -h '```python' -A 50 | \
            grep -v '```' | \
            head -c 500)
      continue-on-error: true

    - name: Validate YAML in code blocks
      run: |
        pip install pyyaml
        # Check for YAML syntax in markdown code blocks
        echo "✅ YAML validation placeholder"

  spell-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install spell checker
      run: |
        sudo apt-get update
        sudo apt-get install -y aspell aspell-en

    - name: Spell check documentation
      run: |
        find docs -name '*.md' -exec aspell check {} \; 2>&1 || true
      continue-on-error: true

  accessibility:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Docusaurus
      run: npm run build

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        temporaryPublicStorage: true
        configPath: './lighthouse.json'
      continue-on-error: true

  coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Document coverage stats
      run: |
        echo "📊 Documentation Coverage Report"
        echo "Total chapters expected: 23"
        echo "Chapters with content: $(find docs -name 'chapter-*.md' -type f | wc -l)"
        echo "Code examples: $(grep -r '```' docs --include='*.md' | wc -l)"
        echo "Diagrams: $(find static/img -name '*.png' -o -name '*.svg' | wc -l)"
      continue-on-error: true

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
      continue-on-error: true

    - name: Check for hardcoded credentials
      run: |
        if grep -r "password:" docs --include='*.md' | grep -v "password: " | grep -v "password\"" ; then
          echo "⚠️ Potential credentials found in documentation"
          exit 1
        fi
      continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: [build, linkcheck, syntax-check, security]
    if: always()

    steps:
    - name: Build status
      run: |
        if [ "${{ needs.build.result }}" = "success" ]; then
          echo "✅ Build successful"
        else
          echo "❌ Build failed"
          exit 1
        fi
